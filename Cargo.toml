[package]
name = "duckduckgo-mcp-server"
version = "0.1.0"
edition = "2021"
description = "MCP Server for searching via DuckDuckGo"
authors = ["Nick Clyde"]
license = "MIT"

[dependencies]
rmcp = { version = "1.3.0", features = ["server", "transport-streamable-http-server", "transport-streamable-http-server-session", "transport-io", "schemars"] }
reqwest = { version = "0.12", features = ["json"] }
scraper = "0.21"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
regex = "1"
once_cell = "1"
axum = "0.8"
schemars = "1.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
